<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claim Viewer</title>
<style>
:root{--ctl:#767f8c;--bg:#fff;--panel:#f6f7f9;--ink:#15181d;--mute:#5d6672;--line:#d9dee5;--acc:#1f5fbf;--ok:#17713f;--warn:#9a5b00;--bad:#b3261e;--hl:#fff1a8;--dp:#0e7c86;--dn:#c2410c;--dm:#7c3aed}
@media (prefers-color-scheme:dark){:root{--ctl:#6b7684;--bg:#14171c;--panel:#1c2027;--ink:#e8ebef;--mute:#9aa4b0;--line:#2d333c;--acc:#7aa7ff;--ok:#5fd08e;--warn:#e0a548;--bad:#ff8a80;--hl:#4a4310;--dp:#4fd1c5;--dn:#fb923c;--dm:#b794f4}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;height:100vh;display:grid;grid-template-columns:330px minmax(340px,1fr) minmax(360px,1.1fr)}
aside,main,section{overflow:auto;height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:12px;overflow:hidden;display:flex;flex-direction:column}
#flt{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}#flt{gap:0 8px}#flt label.f{margin:9px 0 3px;font-size:10px;line-height:1.2;color:var(--mute);text-transform:none;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}body.graph #fs{display:none}#flt .w{grid-column:1/-1}
#flt select,#flt input{padding:4px 6px}
#reads{flex:1;min-height:0;overflow:auto;margin-top:4px;display:grid;grid-template-columns:1fr 1fr;column-gap:8px;align-content:start}#reads .f{grid-column:1/-1}#reads .read{margin-top:2px;font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:14px;border-right:1px solid var(--line)}
h1{font-size:16px;margin:0 0 10px}
label.f{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:12px 0 3px}
select,input[type=search]{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.count{color:var(--mute);margin:0 0 10px}
.card{border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin:0 0 16px;line-height:1.55;cursor:pointer;background:var(--bg)}
.card:hover,.card:focus-visible{border-color:var(--acc);outline:none}
.card.sel{border-color:var(--acc);background:var(--panel)}
.quote{background:var(--hl);padding:1px 3px;border-radius:3px}.quote[contenteditable=plaintext-only]{outline:2px solid #5b9dff;background:transparent;cursor:text}
.gist{color:var(--mute);margin:6px 0 4px;font-size:13px}
.meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:11.5px;margin-top:6px}
.tag{border:1px solid var(--line);border-radius:3px;padding:1px 6px;white-space:nowrap}
.tag.q{border-color:var(--acc);color:var(--acc)}
.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}.tag.bad{color:var(--bad)}
.pg{font-variant-numeric:tabular-nums;font-weight:600}
.grp{font-size:13px;font-weight:700;margin:18px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
section{display:flex;flex-direction:column}
section header{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
iframe{flex:1;border:0;width:100%}
#rd{flex:1;overflow:auto;background:#888}#rd .pg{position:relative;margin:6px auto;background:#fff}#rd canvas{display:block}.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;z-index:2}
#rd .pg{isolation:isolate}.hl{position:absolute;z-index:1;mix-blend-mode:multiply;pointer-events:none}.hl.on{outline:2px solid var(--acc);outline-offset:-2px}
#rt{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:0 6px 6px}#rt[hidden]{display:none}
#rt button{padding:4px 10px;border:1px solid var(--ctl);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
#rt.nat>:not(#nv){display:none}
.sw{display:inline-flex;gap:6px;align-items:center}.sw button{width:22px;height:22px;padding:0;border:2px solid var(--ctl);border-radius:50%;cursor:pointer}
#cm .sw{display:flex;padding:6px 12px}#cm .sw button{display:inline-block;padding:0}
#cm button:disabled{color:var(--ctl);cursor:not-allowed}.textLayer span{position:absolute;white-space:pre;color:transparent;transform-origin:0 0}.textLayer ::selection{background:transparent}.bsel{position:absolute;z-index:2;background:rgba(0,90,255,.35);pointer-events:none}.rtop{padding:8px 10px 4px}.rsel{display:flex;gap:8px;align-items:center}.rsel select{flex:1;min-width:0}#lpn{margin-top:6px;font-size:.8rem;opacity:.65}#lpn:empty{display:none}#lpn.warn{display:block;cursor:pointer;background:#fde68a;color:#3b2f00;padding:6px 8px;font-weight:600}#toast.top{top:14px;transform:translateX(-50%)}#toast{pointer-events:none;position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);z-index:9;background:#1f2937;color:#fff;padding:10px 16px;border-radius:8px;max-width:min(60vw,420px);max-height:40vh;overflow:hidden;overflow-wrap:anywhere;text-align:center}#ask{border:1px solid var(--ctl);border-radius:10px;padding:18px 20px;max-width:min(360px,90vw);overflow-wrap:anywhere;font:inherit}#ask p{margin:0 0 12px}#ask label{display:block;margin:0 0 12px;font-size:.9em}#ask div{display:flex;gap:8px;justify-content:flex-end}

.empty{padding:30px;color:var(--mute)}
.rl{margin:6px 0 0;padding-left:16px;max-height:34vh;overflow:auto}.rl button{all:unset;cursor:pointer;color:var(--acc);font-weight:600}.rl small{color:var(--mute)}
.read{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:13px}
#gv{display:none;grid-column:2/4;overflow:auto;height:100vh;padding:14px}
body.graph main,body.graph section{display:none}body.graph #gv{display:block}
.tabs{display:flex;gap:6px;margin:0 0 8px}.tabs button{flex:1;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}.tabs button.on{border-color:var(--acc);color:var(--acc);font-weight:700}
#gv svg{width:100%;height:auto;min-width:760px}#gv text{fill:var(--ink);font-size:12px}#gv .cnt{fill:var(--mute)}#gv .hd{font-weight:700;fill:var(--mute);font-size:11px;text-transform:uppercase}
#gv .e{fill:none;opacity:.45;cursor:pointer}#gv .e:hover{opacity:.95}#gv .n{cursor:pointer}#gv .n rect{fill:var(--panel);stroke:var(--line)}#gv .n:hover rect{stroke:var(--acc)}
#gv .e.dim{opacity:.08}#gv .e.hit{opacity:1}#gv .n.dim{opacity:.35}#gv .n.hit rect{fill:var(--hl);stroke:var(--acc);stroke-width:2.5}
#ed,#vl{position:fixed;left:12px;top:12px;margin:0;max-height:92vh;overflow:auto;z-index:9;background:var(--panel);color:var(--ink);border:2px solid var(--acc);border-radius:8px;padding:14px}#ed label,#vl label{display:grid;gap:3px;font-size:12px;font-weight:700;color:var(--mute)}#ed input,#ed textarea,#ed select,#vl textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:6px}
#ed button,#vl button{padding:6px 16px;border:1px solid var(--acc);border-radius:6px;background:var(--bg);color:var(--acc);font:inherit;cursor:pointer}#ed button[value=ok],#vl button[value=ok]{background:var(--acc);color:var(--bg);font-weight:700}
#vl{left:50%;top:50%;transform:translate(-50%,-50%)}#vl form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(1000px,92vw)}#vl form>b,#vl form>small,#vl form>div:last-child{grid-column:1/-1}#vl form>b{font-size:16px}
#vl .col{display:flex;flex-direction:column;gap:8px;min-width:0}#vl h4{margin:0}#vl .items{display:grid;gap:6px;max-height:55vh;overflow:auto;padding-right:2px}
#vl .it{display:flex;gap:4px}#vl .it input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:6px}#vl .it .k{flex:0 0 40px;text-align:center;font-weight:700}#vl .x{padding:2px 9px;color:var(--dn);border-color:var(--line)}#vl .add{border-style:dashed}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0;margin:0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.bar button,.bar .gbtn{margin:0;padding:4px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}.bar button:hover,.bar .gbtn:hover{border-color:var(--acc)}#count button{margin-left:8px;padding:1px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--acc);font:inherit;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.card:focus-visible,.gbtn:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.selbar{border:1px solid var(--acc);border-radius:6px;padding:8px 10px;margin:8px 0;font-size:13px;background:var(--panel)}.selbar button,.gbtn{margin-left:8px;padding:3px 8px;border:1px solid var(--acc);border-radius:5px;background:var(--bg);color:var(--acc);font:inherit;cursor:pointer}
.lg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mute);margin:6px 0}.lg i{display:inline-block;width:18px;height:4px;vertical-align:middle;margin-right:4px}
@media (max-width:1000px){body{grid-template-columns:1fr;height:auto}aside,main,section{height:auto;max-height:none}iframe{min-height:70vh}}
select,input,textarea,.bar button,#count button,.tabs button,#ed button,#vl button,#vl .it input{border-color:var(--ctl)}
#cm{position:fixed;z-index:20;background:var(--bg);border:1px solid var(--ctl);border-radius:4px;padding:4px}
#cm button{display:block;padding:6px 12px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;text-align:left}
#cm [hidden]{display:none}
#cm button:hover{background:var(--panel)}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}.bar button,.bar .gbtn,#rt button,#lp{display:inline-flex;align-items:center;justify-content:center;min-width:32px}
.gc{margin:0 0 8px}.gc .gh{display:block;font-size:10px;color:var(--mute);margin:0 0 2px}.gc .tabs{margin:0 0 4px}
.gc .ck{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;align-items:center}.gc .ck b{font-size:10px;font-weight:400;color:var(--mute)}.gc .ck label{display:flex;gap:4px;align-items:center;cursor:pointer}
.gc .lk,body.gnet .gc .ly{display:none}body.gnet .gc .lk{display:flex}
#gv .nn{cursor:pointer}#gv .nn circle{stroke:var(--bg);stroke-width:1.5}#gv .nn:hover circle,#gv .nn.hit circle{stroke:var(--acc);stroke-width:3}#gv .nn.dim{opacity:.25}
#gv .ce{fill:none;stroke:var(--mute);stroke-width:1;opacity:.35}#gv .ce.tag{stroke:var(--acc);opacity:.55}#gv .ce.opp{stroke:var(--dn);stroke-dasharray:4 3;opacity:.75}#gv .ce.dim{opacity:.04}#gv .ce.hit{opacity:1;stroke-width:2}
</style>
</head>
<body>
<aside>
  <h1>Claim Viewer</h1>
  <div class="tabs"><button id="tl" class="on">List</button><button id="tg">Graph</button></div>
  <div class="gc" id="gc1"></div>
  <div id="flt"><label class="f w" for="q">Find words in quotes</label><input class="w" id="q" type="search" placeholder="Quote or gist" style="grid-column:1/-1">
  <label class="f w" for="src">Reading</label><select id="src" style="grid-column:1/-1"></select>
  <label class="f" for="role">Type of claim</label><select id="role"></select>
  <label class="f" for="pw">Pathway (variant)</label><select id="pw"></select>
  <label class="f w" for="fa">Q1: what makes variants differ</label><select id="fa" style="grid-column:1/-1"></select>
  <label class="f w" for="oc">Q2: what a variant does</label><select id="oc" style="grid-column:1/-1"></select>
  <label class="f" for="dir" title="Sign of change in the outcome, not good or bad">Up or down (Q2)</label><select id="dir" title="Sign of change in the outcome, not good or bad"></select>
  <label class="f" for="ev">Kind of evidence</label><select id="ev"></select>
  <label class="f" for="own">Own or cited claim</label><select id="own"><option value="">Any author</option><option value="1">Own</option><option value="0">Cited</option></select>
  <label class="f" for="grp">Group the list by</label><select id="grp"><option value="source">Group: source</option><option value="pathway">Group: pathway</option><option value="factor">Group: Q1 factor</option><option value="outcome">Group: Q2 outcome</option><option value="section">Group: section</option></select>
  <label class="f" for="rl">Links to other readings</label><select id="rl"><option value="">Any links</option><option value="rel">Related</option><option value="opp">Opposite sign</option></select></div>
  <div id="reads"></div>
</aside>
<dialog id="vl"><form method="dialog">
  <b>Lists</b>
  <small>Type to rename. ✕ removes.</small>
  <div class="col" data-c="p"><h4>Pathways</h4><div class="items"></div><button type="button" class="add">+ Add</button></div>
  <div class="col" data-c="f"><h4>Q1 factors</h4><div class="items"></div><button type="button" class="add">+ Add</button></div>
  <div class="col" data-c="o"><h4>Q2 outcomes</h4><div class="items"></div><button type="button" class="add">+ Add</button></div>
  <div><button value="ok">Save</button> <button value="x" formnovalidate>Cancel</button></div>
</form></dialog>
<dialog id="ed"><form method="dialog" style="display:grid;gap:6px;width:min(420px,40vw)">
  <b id="edt"></b>
  <label>Source <select name="src"></select></label>
  <label>Quote <textarea name="quote" rows="5" required></textarea></label>
  <label>Gist <textarea name="gist" rows="2"></textarea></label>
  <label>Role <select name="role"></select></label>
  <label>Pathways (e.g. 1,3) <input name="pathway"></label>
  <label>Q1 factor <input name="factor" list="dlf"></label>
  <label>Q2 outcome <input name="outcome" list="dlo"></label>
  <label>Direction <select name="direction"><option value=""></option><option>+</option><option>-</option><option>mixed</option><option>none</option></select></label>
  <label>PDF page <input name="pdf_page" type="number" min="1"></label>
  <label>Section <input name="section"></label>
  <datalist id="dlf"></datalist><datalist id="dlo"></datalist>
  <div><button value="ok">Save</button> <button value="x" formnovalidate>Cancel</button></div>
</form></dialog>
<main aria-live="polite"><div class="bar"><button id="vb" title="Edit lists" aria-label="Edit lists"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button><button id="ex" title="Export edits" aria-label="Export edits"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-4-4 4 4 4-4M5 20h14"/></svg></button><label class="gbtn" title="Import edits" aria-label="Import edits" style="margin:0"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m-4 4 4-4 4 4M5 20h14"/></svg><input id="im" type="file" accept=".json" hidden></label><button id="rs" title="Reset edits" aria-label="Reset edits"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></svg></button></div><p class="count" id="count" aria-live="polite"></p><div id="list"></div></main>
<div id="gv"><h1 id="gt"></h1><div class="gc" id="gc2"></div><div id="gout"></div></div>
<section><div class="empty" id="ph">Pick a reading.</div><div class="rtop"><div class="rsel"><select id="pdfsel" aria-label="Reading"></select><button id="lp" type="button" title="Choose PDF folder" aria-label="Choose PDF folder"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h6l2 2h10v10H3z"/></svg></button><input id="lpf" type="file" webkitdirectory multiple hidden></div><div id="lpn"></div></div><div id="rt" hidden><button id="zo" type="button" aria-label="Zoom out">−</button><span id="zv">100%</span><button id="zi" type="button" aria-label="Zoom in">+</button><button id="zf" type="button" title="Fit width" aria-label="Fit width"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button><button id="sv" type="button" title="Save PDF" aria-label="Save PDF"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-4-4 4 4 4-4M5 20h14"/></svg></button><span class="sw" id="hs" role="group" aria-label="Highlight colour"></span><button id="hc" type="button" title="Clear all highlights in this PDF (right-click one highlight to remove only it)" aria-label="Clear all highlights"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></button><button id="nv" type="button" title="Open in Chrome viewer" aria-label="Switch viewer"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg></button><button id="fs" type="button" title="Full screen PDF" aria-label="Full screen PDF" onclick="var f=document.getElementById('rd').hidden?document.getElementById('pdf'):document.getElementById('rd');document.fullscreenElement?document.exitFullscreen():f.requestFullscreen()"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-7 7M10 20H4v-6M4 20l7-7"/></svg></button></div><iframe id="pdf" allowfullscreen title="Source PDF" hidden></iframe><div id="rd" hidden></div></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="sources.js"></script>
<script>
const DATA={"vocab": {"pathways": {"1": "Pathway 1", "2": "Pathway 2", "3": "Pathway 3", "4": "Pathway 4", "5": "Pathway 5", "6": "Pathway 6"}, "roles": {"Q1": "Determinant: a cause of the variation", "Q2": "Effect: an outcome of the variation", "TYPOLOGY": "Defines or classifies, no cause or effect", "OTHER": "Other relevant context"}, "evidence": ["theory", "case-study", "cross-country-quantitative", "firm-level-quantitative", "historical", "review-of-literature", "author-assertion"], "direction": ["+", "-", "mixed", "none"], "direction_rule": "Direction is the sign of change in the NAMED outcome quantity, never good or bad. '+' = the quantity named in 'outcome' rises. '-' = it falls. 'mixed' = it rises in one place or time and falls in another. 'none' = no change, or the authors did not assess it. Example: SOE losses grow -> outcome 'fiscal and financial burden', direction '+'. Privatization cuts the state deficit -> same outcome, direction '-'.", "expected_rule": "expected = true when the quote is a forecast, an expectation, a hypothetical ('may', 'likely', 'if... then'), a stated limit of the study, or a view the authors report without testing. Such a claim keeps its role (Q2 if it names an outcome) and gets expected = true. expected = false for measured or observed findings.", "q1_factors": ["Factor 1", "Factor 2", "Factor 3"], "q2_outcomes": ["Outcome 1", "Outcome 2", "Outcome 3"]}, "sources": []};
if(window.SOURCES)DATA.sources=SOURCES.map(s=>DATA.sources.find(x=>x.id===s.id)||{id:s.id,kind:"paper",title:s.title||s.id,claims:[]});
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const all=[];DATA.sources.forEach(s=>s.claims.forEach(c=>all.push({...c,src:s.id,srcTitle:s.title})));
// user edits live in this browser (localStorage); Delete only hides, so related-claim indices stay valid
let ED={m:{},a:[],d:[]};try{ED=JSON.parse(localStorage.getItem("cv:edits"))||ED}catch(e){}
const kc=c=>c.src+"\u0001"+c.id;
all.forEach(c=>{Object.assign(c,ED.m[kc(c)]||{});c.del=ED.d.includes(kc(c))});
ED.a.forEach(c=>all.push(c));
// user-edited lists (ED.v) replace the built-in vocab; ED.r maps a renamed label to its new name so tagged claims follow
if(ED.v){DATA.vocab.pathways=ED.v.p;DATA.vocab.q1_factors=ED.v.f;DATA.vocab.q2_outcomes=ED.v.o;}
all.forEach(c=>{const r=ED.r||{};if(c.factor&&r[c.factor])c.factor=r[c.factor];if(c.outcome&&r[c.outcome])c.outcome=r[c.outcome];});
const PW=DATA.vocab.pathways;
const opts=(el,label,vals)=>{el.innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("")};
opts($("src"),"All sources",DATA.sources.map(s=>s.id));
opts($("role"),"All roles",Object.keys(DATA.vocab.roles));
opts($("pw"),"All pathways",Object.keys(PW).map(k=>k+" "+PW[k]).concat(["none"]));
const extra=k=>[...new Set(all.map(c=>c[k]).filter(v=>v&&v.startsWith("other:")))].sort();
opts($("fa"),"All factors",DATA.vocab.q1_factors.concat(["(other)"],extra("factor")));
opts($("oc"),"All outcomes",DATA.vocab.q2_outcomes.concat(["(other)"],extra("outcome")));
const isOther=(v,list)=>!!v&&!list.includes(v);
opts($("dir"),"Any sign",DATA.vocab.direction);
opts($("ev"),"All evidence",DATA.vocab.evidence);
let sel=null;
const FL=["q","src","role","pw","fa","oc","dir","ev","own","rl"];
function clearFilters(){FL.forEach(i=>$(i).value="");refresh()}
function pass(c){
  if(c.del)return false;
  const q=$("q").value.toLowerCase();
  if(q&&!(c.quote+" "+c.gist).toLowerCase().includes(q))return false;
  if($("src").value&&c.src!==$("src").value)return false;
  if($("role").value&&c.role!==$("role").value)return false;
  const pw=$("pw").value;
  if(pw){const n=pw==="none"?[]:[pw.split(" ")[0]];
    if(pw==="none"?(c.pathway||[]).length:!(c.pathway||[]).map(String).includes(n[0]))return false;}
  const fa=$("fa").value,oc=$("oc").value;
